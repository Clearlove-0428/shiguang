name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:source
